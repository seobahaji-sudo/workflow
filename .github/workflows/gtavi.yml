name: Auto Publish GTA 6 News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install rss-parser axios node-html-parser @google/genai form-data fs mime

      - name: Run Fetch and Publish Script
        run: node fetch_and_publish.js

      - name: Commit history.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.json
          git commit -m "chore: update published history" || echo "No changes to commit"
          git push
